[package]
name = "neolatex"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Fast and elegant LaTeX editor with live PDF preview"

[[bin]]
name = "neolatex"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow"] }
egui  = "0.29"
pdfium-render = { version = "0.8", features = ["thread_safe", "image"] }
image = { version = "0.25", default-features = false, features = ["png"] }
tempfile = "3"
crossbeam-channel = "0.5"
rfd = "0.14"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[profile.release]
opt-level   = 3
lto         = "thin"
strip       = true
panic       = "abort"
codegen-units = 1
